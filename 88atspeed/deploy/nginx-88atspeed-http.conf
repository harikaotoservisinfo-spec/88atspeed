# 88atspeed.lerta.tr — HTTP (SSL öncesi veya DNS beklerken)

server {
    listen 80;
    listen [::]:80;
    server_name 88atspeed.lerta.tr;

    client_max_body_size 64m;
    access_log /var/log/nginx/88atspeed.access.log;
    error_log  /var/log/nginx/88atspeed.error.log;

    location / {
        proxy_pass http://127.0.0.1:3023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }
}
