# 88atspeed.lerta.tr — TJK At Yarışı Analiz Platformu (bağımsız)
# LERTA ve U88 sitelerinden tamamen ayrı çalışır

server {
    listen 80;
    listen [::]:80;
    server_name 88atspeed.lerta.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 88atspeed.lerta.tr;

    ssl_certificate     /etc/letsencrypt/live/88atspeed.lerta.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88atspeed.lerta.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    access_log /var/log/nginx/88atspeed.access.log;
    error_log  /var/log/nginx/88atspeed.error.log;

    location / {
        proxy_pass http://127.0.0.1:3023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
    }
}
