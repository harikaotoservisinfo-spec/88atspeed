<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Tahminim - 88ATSPEED</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/theme.css?v=20260822a" rel="stylesheet">
    <style>
        #tahminimContainer { padding: 20px 24px 32px; max-width: 100%; }
        .tahminim-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .tahminim-btn {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .tahminim-btn:hover { background: var(--bg-surface); }
        .tahminim-btn-primary {
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
            color: #fff;
            border-color: #0d47a1;
        }
        .tahminim-btn-primary:hover { filter: brightness(1.05); }
        .tahminim-meta {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .tahminim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .tahmin-race-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .tahmin-race-header {
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
            color: #e3f2fd;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .tahmin-race-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .tahmin-race-body { padding: 12px 14px 14px; }
        .tahmin-row {
            display: grid;
            grid-template-columns: 36px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .tahmin-row:last-child { margin-bottom: 0; }
        .tahmin-sira {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tahmin-at-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            background: #fff;
            color: var(--text-primary);
        }
        .tahmin-at-input:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
        }
        .tahmin-at-input::placeholder { color: var(--text-muted); font-weight: 500; }
        .tahmin-hint {
            margin-top: 16px;
            padding: 12px 14px;
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: var(--radius-md);
            font-size: 13px;
            color: #0d47a1;
        }
    </style>
</head>
<body>
<div id="tahminimContainer">
    <div class="tahminim-controls">
        <button type="button" id="kayitSenkronBtn" class="tahminim-btn tahminim-btn-primary">🔄 GÖSTERİM kaydını kullan</button>
        <button type="button" id="kayitlariGetirBtn" class="tahminim-btn">📋 Kayıt listesinden seç</button>
        <button type="button" id="tahminKaydetBtn" class="tahminim-btn">💾 Tahminleri kaydet</button>
        <button type="button" id="tahminTemizleBtn" class="tahminim-btn">🗑️ Temizle</button>
    </div>
    <div id="kayitListesi" class="kayit-listesi" style="display:none;"></div>
    <div id="tahminimStatus"></div>
    <div id="tahminimMeta" class="tahminim-meta" style="display:none;"></div>
    <div id="tahminimResults"><div class="empty">🎯 GÖSTERİM sekmesinde kayıt yükleyin veya buradan kayıt seçin</div></div>
    <div class="tahmin-hint">
        Aktarma kuralları henüz tanımlanmadı. Koşu sayısı kadar tahmin alanı açılır; at isimlerini elle girebilir veya
        sonraki adımda GÖSTERİM hesaplamalarından otomatik aktaracağız.
    </div>
</div>

<script src="js/utils.js?v=20260822h"></script>
<script>
let currentKayitId = null;
let currentKayitMeta = null;
let currentRaceData = null;

function storageKey() {
    return currentKayitId ? '88atspeed-tahmin-' + currentKayitId : null;
}

function loadTahminFromStorage() {
    const key = storageKey();
    if (!key) return null;
    try {
        return JSON.parse(localStorage.getItem(key) || 'null');
    } catch (_) { return null; }
}

function saveTahminToStorage(tahminler) {
    const key = storageKey();
    if (!key) return;
    localStorage.setItem(key, JSON.stringify(tahminler));
}

function getTahminlerFromDom() {
    const tahminler = {};
    document.querySelectorAll('.tahmin-race-card').forEach(card => {
        const raceIdx = card.dataset.raceIndex;
        tahminler[raceIdx] = [];
        card.querySelectorAll('.tahmin-at-input').forEach(input => {
            tahminler[raceIdx].push({
                sira: parseInt(input.dataset.sira, 10),
                name: input.value.trim()
            });
        });
    });
    return tahminler;
}

function applyTahminlerToDom(tahminler) {
    if (!tahminler) return;
    for (const raceIdx of Object.keys(tahminler)) {
        const card = document.querySelector('.tahmin-race-card[data-race-index="' + raceIdx + '"]');
        if (!card) continue;
        const rows = tahminler[raceIdx] || [];
        card.querySelectorAll('.tahmin-at-input').forEach(input => {
            const sira = parseInt(input.dataset.sira, 10);
            const found = rows.find(r => r.sira === sira);
            if (found) input.value = found.name || '';
        });
    }
}

function setStatus(html) {
    document.getElementById('tahminimStatus').innerHTML = html;
}

function updateMeta() {
    const el = document.getElementById('tahminimMeta');
    if (!currentKayitMeta || !currentRaceData) {
        el.style.display = 'none';
        return;
    }
    el.style.display = 'block';
    el.innerHTML = '📅 ' + AtSpeedUtils.escapeHtml(currentKayitMeta.tarih)
        + ' | 🏟️ ' + AtSpeedUtils.escapeHtml(currentKayitMeta.hipodrom)
        + ' | 🏁 ' + currentRaceData.length + ' koşu'
        + ' | Kayıt ID: ' + currentKayitId;
}

function buildTahminGrid(data) {
    if (!data || !data.length) {
        document.getElementById('tahminimResults').innerHTML = '<div class="empty">⚠️ Veri bulunamadı</div>';
        return;
    }

    let html = '<div class="tahminim-grid">';
    for (let i = 0; i < data.length; i++) {
        const race = data[i];
        const raceNo = race.raceNo || (i + 1);
        const mesafe = (race.mesafe && race.mesafe !== '?') ? race.mesafe : (race.raceDistance || '?');
        const pist = race.pist || '';
        const mesafeGosterim = mesafe !== '?' ? mesafe + (pist ? ' ' + pist : '') : '?';
        const horseCount = (race.horses || []).length;

        html += '<div class="tahmin-race-card" data-race-index="' + i + '">';
        html += '<div class="tahmin-race-header">';
        html += '<span>🏁 ' + raceNo + '. KOŞU</span>';
        html += '<span class="tahmin-race-badge">' + horseCount + ' AT</span>';
        html += '<span class="tahmin-race-badge">' + AtSpeedUtils.escapeHtml(mesafeGosterim) + '</span>';
        html += '</div><div class="tahmin-race-body">';

        for (let s = 1; s <= horseCount; s++) {
            html += '<div class="tahmin-row">';
            html += '<div class="tahmin-sira">' + s + '</div>';
            html += '<input type="text" class="tahmin-at-input" data-sira="' + s + '"';
            html += ' placeholder="' + s + '. sıra — at ismi" autocomplete="off">';
            html += '</div>';
        }

        html += '</div></div>';
    }
    html += '</div>';
    document.getElementById('tahminimResults').innerHTML = html;

    applyTahminlerToDom(loadTahminFromStorage());

    document.querySelectorAll('.tahmin-at-input').forEach(input => {
        input.addEventListener('input', () => saveTahminToStorage(getTahminlerFromDom()));
    });
}

function onKayitLoaded(kayit) {
    currentKayitId = kayit.id;
    currentKayitMeta = {
        tarih: kayit.tarih,
        hipodrom: kayit.hipodrom,
        race_count: kayit.race_count
    };
    currentRaceData = kayit.veri;
    updateMeta();
    buildTahminGrid(currentRaceData);
    setStatus('<div class="status status-success">✅ ' + currentRaceData.length + ' koşu için tahmin alanları hazır (Kayıt #' + currentKayitId + ')</div>');
}

async function loadKayitById(id) {
    setStatus('<div class="status status-loading">⏳ Kayıt yükleniyor...</div>');
    try {
        const response = await fetch('/api/hesaplama-kayit/' + id);
        const result = await response.json();
        if (!result.success) throw new Error(result.error);
        onKayitLoaded({
            id: id,
            tarih: result.kayit.tarih,
            hipodrom: result.kayit.hipodrom,
            race_count: result.kayit.race_count,
            veri: result.kayit.veri
        });
    } catch (error) {
        setStatus('<div class="status status-error">❌ ' + error.message + '</div>');
    }
}

document.getElementById('kayitlariGetirBtn').onclick = async () => {
    const kayitListesiDiv = document.getElementById('kayitListesi');
    setStatus('<div class="status status-loading">⏳ Kayıtlar yükleniyor...</div>');
    try {
        const response = await fetch('/api/hesaplama-kayitlar');
        const result = await response.json();
        if (!result.success) throw new Error(result.error);
        if (!result.kayitlar.length) {
            kayitListesiDiv.innerHTML = '<div class="empty">Kayıt yok</div>';
            kayitListesiDiv.style.display = 'block';
            return;
        }
        let html = '<div class="kayit-listesi-title">📋 HESAPLAMA KAYITLARI</div>';
        for (const k of result.kayitlar) {
            html += '<div class="kayit-item" data-id="' + k.id + '">';
            html += '<span>📅 ' + AtSpeedUtils.escapeHtml(k.tarih) + ' | 🏟️ ' + AtSpeedUtils.escapeHtml(k.hipodrom);
            html += ' | 🏁 ' + k.race_count + ' koşu</span>';
            html += '<span class="kayit-item-action">Yükle →</span></div>';
        }
        kayitListesiDiv.innerHTML = html;
        kayitListesiDiv.style.display = 'block';
        kayitListesiDiv.querySelectorAll('.kayit-item').forEach(item => {
            item.onclick = async () => {
                await loadKayitById(item.dataset.id);
                kayitListesiDiv.style.display = 'none';
            };
        });
        setStatus('<div class="status status-success">✅ ' + result.kayitlar.length + ' kayıt listelendi</div>');
    } catch (error) {
        setStatus('<div class="status status-error">❌ ' + error.message + '</div>');
    }
};

document.getElementById('kayitSenkronBtn').onclick = () => {
    window.parent.postMessage({ type: '88atspeed-request-gosterim-kayit' }, '*');
    setStatus('<div class="status status-loading">⏳ GÖSTERİM sekmesinden kayıt isteniyor...</div>');
};

document.getElementById('tahminKaydetBtn').onclick = () => {
    if (!currentKayitId) {
        setStatus('<div class="status status-error">❌ Önce kayıt yükleyin</div>');
        return;
    }
    saveTahminToStorage(getTahminlerFromDom());
    setStatus('<div class="status status-success">✅ Tahminler kaydedildi (tarayıcıda)</div>');
};

document.getElementById('tahminTemizleBtn').onclick = () => {
    if (!currentKayitId) return;
    if (!confirm('Bu kayıt için tüm tahminler silinsin mi?')) return;
    localStorage.removeItem(storageKey());
    document.querySelectorAll('.tahmin-at-input').forEach(input => { input.value = ''; });
    setStatus('<div class="status status-warning">⚠️ Tahminler temizlendi</div>');
};

window.addEventListener('message', (e) => {
    if (e.data?.type === '88atspeed-kayit-loaded' && e.data.kayit) {
        onKayitLoaded(e.data.kayit);
    }
});

/** Dışarıdan aktarma kuralları için (sonraki adım) */
window.TahminimPage = {
    getRaceData: () => currentRaceData,
    getKayitId: () => currentKayitId,
    setTahminAt: (raceIndex, sira, name) => {
        const input = document.querySelector(
            '.tahmin-race-card[data-race-index="' + raceIndex + '"] .tahmin-at-input[data-sira="' + sira + '"]'
        );
        if (input) {
            input.value = name || '';
            saveTahminToStorage(getTahminlerFromDom());
        }
    },
    setTahminler: (tahminler) => {
        applyTahminlerToDom(tahminler);
        saveTahminToStorage(getTahminlerFromDom());
    }
};
</script>
</body>
</html>
