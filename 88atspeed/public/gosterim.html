<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gösterim - 88ATSPEED</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; color: #fff; }
        .gosterim-controls {
            background: rgba(30, 30, 60, 0.8);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: #ff9800; }
        .gosterim-btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff9800, #f44336);
            color: white;
            min-width: 160px;
            border: none;
        }
        .gosterim-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .results-table {
            background: rgba(30, 30, 60, 0.6);
            border-radius: 20px;
            overflow-x: auto;
            padding: 15px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.05); }
        th {
            background: rgba(0,0,0,0.4);
            color: #ff9800;
            font-weight: 600;
            position: sticky;
            top: 0;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        th:hover { background: rgba(255,152,0,0.3); }
        th .sort-icon { display: inline-block; margin-left: 5px; font-size: 10px; opacity: 0.5; }
        th.sort-asc .sort-icon { opacity: 1; transform: rotate(0deg); }
        th.sort-desc .sort-icon { opacity: 1; transform: rotate(180deg); display: inline-block; }
        .status { padding: 12px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .status-loading { background: rgba(255,152,0,0.2); color: #ff9800; }
        .status-success { background: rgba(76,175,80,0.2); color: #4CAF50; }
        .status-error { background: rgba(244,67,54,0.2); color: #f44336; }
        .empty { text-align: center; padding: 60px; color: rgba(255,255,255,0.5); }
        .race-card { background: rgba(30,30,60,0.4); border-radius: 16px; margin-bottom: 20px; overflow: hidden; }
        .race-header { background: linear-gradient(135deg, rgba(255,152,0,0.2), rgba(76,175,80,0.1)); padding: 10px 15px; font-weight: bold; font-size: 14px; }
        .kayit-listesi {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        .kayit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
        }
        .kayit-item:hover { background: rgba(255,152,0,0.2); }
        .sari-hucre { background-color: #ffeb3b !important; color: #000 !important; font-weight: bold; }
        tr.sari-satir td { background-color: #fff9c4 !important; color: #000 !important; }
        .eniyi-test1 { background-color: #ffeb3b !important; color: #000 !important; font-weight: bold; }
        .eniyi-test2 { background-color: #ffeb3b !important; color: #000 !important; font-weight: bold; }
        .kirmizi-yazi { color: #ff0000 !important; font-weight: bold; }
        .yesil-yazi { color: #00cc00 !important; font-weight: bold; }
    </style>
</head>
<body>
<div id="gosterimContainer">
<div class="gosterim-controls">
<div class="control-group"><button id="kayitlariGetirBtn" class="gosterim-btn">📋 HESAPLAMA KAYITLARI</button></div>
</div>
<div id="kayitListesi" class="kayit-listesi" style="display:none;"></div>
<div id="gosterimStatus"></div>
<div id="gosterimResults" class="results-table"><div class="empty">🏇 HESAPLAMA KAYITLARI butonuna tıklayın</div></div>
</div>

<script>
let currentHesaplamaData = null;
let currentHesaplamaId = null;
let currentSort = { column: null, direction: 'asc' };

function dereceToSalise(derece) {
    if (!derece || derece === '-' || derece === 'Derecesiz') return null;
    try {
        let s = derece.toString().trim().replace(/:/g, '.');
        let parts = s.split('.');
        if (parts.length === 3) {
            return (parseInt(parts[0]) * 60 * 100) + (parseInt(parts[1]) * 100) + parseInt(parts[2]);
        } else if (parts.length === 2) {
            return (parseInt(parts[0]) * 100) + parseInt(parts[1]);
        } else if (parts.length === 1) {
            return parseInt(parts[0]) * 100;
        }
    } catch(e) { return null; }
    return null;
}

function saliseToDerece(salise) {
    if (!salise) return '-';
    try {
        let salise_int = Math.floor(Math.abs(salise));
        let dk = Math.floor(salise_int / 6000);
        let kalan = salise_int % 6000;
        let sn = Math.floor(kalan / 100);
        let sl = kalan % 100;
        if (dk > 0) return `${dk}.${sn.toString().padStart(2,'0')}.${sl.toString().padStart(2,'0')}`;
        else return `${sn.toString().padStart(2,'0')}.${sl.toString().padStart(2,'0')}`;
    } catch(e) { return '-'; }
}

function saliseToFarkFormat(salise) {
    if (salise === null || salise === undefined) return '-';
    let abs_salise = Math.floor(Math.abs(parseInt(salise)));
    let sn = Math.floor(abs_salise / 100);
    let sl = abs_salise % 100;
    let sign = salise >= 0 ? '+' : '-';
    return `${sign}${sn.toString().padStart(2,'0')}.${sl.toString().padStart(2,'0')}`;
}

function metreBasiSalise(salise, mesafe) {
    if (salise && mesafe && mesafe !== '-' && mesafe !== 'Derecesiz') {
        return salise / parseInt(mesafe);
    }
    return null;
}

document.getElementById('kayitlariGetirBtn').onclick = async () => {
    const statusDiv = document.getElementById('gosterimStatus');
    const kayitListesiDiv = document.getElementById('kayitListesi');
    
    statusDiv.innerHTML = '<div class="status status-loading">⏳ Hesaplama kayıtları yükleniyor...</div>';
    
    try {
        const response = await fetch('/api/hesaplama-kayitlar');
        const result = await response.json();
        
        if (!result.success) throw new Error(result.error);
        
        if (result.kayitlar.length === 0) {
            kayitListesiDiv.innerHTML = '<div class="empty">⚠️ Hiç hesaplama kaydı bulunamadı</div>';
            kayitListesiDiv.style.display = 'block';
            statusDiv.innerHTML = '<div class="status status-error">⚠️ Hiç kayıt yok</div>';
            return;
        }
        
        let html = '<div style="margin-bottom:10px; font-weight:bold;">📋 HESAPLAMA KAYITLARI:</div>';
        for (let i = 0; i < result.kayitlar.length; i++) {
            const k = result.kayitlar[i];
            html += `<div class="kayit-item" data-id="${k.id}">
                        <span>📅 ${k.tarih} | 🏟️ ${k.hipodrom} | 🐎 ${k.total_horses} at | 🕐 ${k.kayit_tarihi}</span>
                        <span style="color:#ff9800;">📂 Yükle →</span>
                    </div>`;
        }
        kayitListesiDiv.innerHTML = html;
        kayitListesiDiv.style.display = 'block';
        
        document.querySelectorAll('.kayit-item').forEach(item => {
            item.onclick = async () => {
                const id = item.dataset.id;
                await loadKayit(id);
                kayitListesiDiv.style.display = 'none';
            };
        });
        
        statusDiv.innerHTML = '<div class="status status-success">✅ ' + result.kayitlar.length + ' kayıt bulundu</div>';
        
    } catch (error) {
        statusDiv.innerHTML = '<div class="status status-error">❌ Hata: ' + error.message + '</div>';
    }
};

async function loadKayit(id) {
    const statusDiv = document.getElementById('gosterimStatus');
    statusDiv.innerHTML = '<div class="status status-loading">⏳ Kayıt yükleniyor...</div>';
    
    try {
        const response = await fetch('/api/hesaplama-kayit/' + id);
        const result = await response.json();
        
        if (!result.success) throw new Error(result.error);
        
        currentHesaplamaData = result.kayit.veri;
        currentHesaplamaId = id;
        
        displayResults(currentHesaplamaData);
        statusDiv.innerHTML = '<div class="status status-success">✅ Kayıt yüklendi! (ID: ' + id + ')</div>';
        
    } catch (error) {
        statusDiv.innerHTML = '<div class="status status-error">❌ Yükleme hatası: ' + error.message + '</div>';
    }
}

function parseNumberFromText(text) {
    if (!text || text === '-') return null;
    let cleaned = text.toString().replace(/[^0-9.-]/g, '');
    let num = parseFloat(cleaned);
    return isNaN(num) ? null : num;
}

function sortTableData(rowsData, columnIndex, type, direction) {
    return rowsData.sort((a, b) => {
        let valA = a.values[columnIndex];
        let valB = b.values[columnIndex];
        
        if (type === 'number') {
            let numA = parseNumberFromText(valA);
            let numB = parseNumberFromText(valB);
            if (numA === null && numB === null) return 0;
            if (numA === null) return 1;
            if (numB === null) return -1;
            return direction === 'asc' ? numA - numB : numB - numA;
        } else if (type === 'date') {
            let dateA = new Date(valA.split('.').reverse().join('-'));
            let dateB = new Date(valB.split('.').reverse().join('-'));
            if (isNaN(dateA)) dateA = new Date(0);
            if (isNaN(dateB)) dateB = new Date(0);
            return direction === 'asc' ? dateA - dateB : dateB - dateA;
        } else {
            valA = valA.toLowerCase();
            valB = valB.toLowerCase();
            return direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
    });
}

function displayResults(data) {
    if (!data || data.length === 0) {
        document.getElementById('gosterimResults').innerHTML = '<div class="empty">⚠️ Veri bulunamadı</div>';
        return;
    }
    
    let html = '';
    let allRaceRowsData = []; // Her koşu için satır verilerini sakla
    
    for (let i = 0; i < data.length; i++) {
        const race = data[i];
        const raceMesafe = (race.mesafe && race.mesafe !== '?') ? race.mesafe : (race.raceDistance || '?');
        const racePist = race.pist || '';
        const mesafeGosterim = raceMesafe !== '?' ? raceMesafe + ' ' + racePist : '?';
        const hedefMesafe = parseInt(raceMesafe);
        
        // TEST1 ve TEST2 değerlerini topla (sıralama için)
        let test1Degerleri = [];
        let test2Degerleri = [];
        
        for (let j = 0; j < race.horses.length; j++) {
            const horse = race.horses[j];
            const kosular = horse.kosular || [];
            for (let idx = 0; idx < kosular.length; idx++) {
                const atKosu = kosular[idx];
                const gecmisMesafe = atKosu.mesafe;
                const dereceStr = atKosu.at_derece;
                const dereceSalise = dereceToSalise(dereceStr);
                const dr_sl = metreBasiSalise(dereceSalise, gecmisMesafe);
                
                let test1Val = null;
                if (dr_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test1Val = hedefMesafe * dr_sl;
                }
                if (test1Val !== null) {
                    test1Degerleri.push({ j, idx, val: test1Val });
                }
                
                // TEST2
                let son800_1 = atKosu.son800_bir;
                const son800_1Salise = dereceToSalise(son800_1);
                const son800_1_sl = son800_1Salise ? son800_1Salise / 800 : null;
                let test2Val = null;
                if (son800_1_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test2Val = hedefMesafe * son800_1_sl;
                }
                if (test2Val !== null) {
                    test2Degerleri.push({ j, idx, val: test2Val });
                }
            }
        }
        
        // Sırala ve en düşük 3'ü bul
        test1Degerleri.sort((a, b) => a.val - b.val);
        test2Degerleri.sort((a, b) => a.val - b.val);
        
        const enIyilerTest1 = new Set();
        const enIyilerTest2 = new Set();
        
        for (let t = 0; t < Math.min(3, test1Degerleri.length); t++) {
            enIyilerTest1.add(`${test1Degerleri[t].j}_${test1Degerleri[t].idx}`);
        }
        for (let t = 0; t < Math.min(3, test2Degerleri.length); t++) {
            enIyilerTest2.add(`${test2Degerleri[t].j}_${test2Degerleri[t].idx}`);
        }
        
        // HER AT İÇİN TEST4 FARKI (TEST8), TEST7 FARKI (TEST9), İLK FARK, SON FARK, FARKLARIN FARKI
        let horseTest4Farki = {};
        let horseTest7Farki = {};
        let horseIlkFark = {};
        let horseSonFark = {};
        let horseFarklarinFarki = {};
        
        for (let j = 0; j < race.horses.length; j++) {
            const horse = race.horses[j];
            const kosular = horse.kosular || [];
            
            // Koşuları tarihe göre sırala (en eskiden en yeniye)
            const kosularSorted = [...kosular].sort((a, b) => {
                const dateA = a.tarih ? new Date(a.tarih.split('.').reverse().join('-')) : new Date(0);
                const dateB = b.tarih ? new Date(b.tarih.split('.').reverse().join('-')) : new Date(0);
                return dateA - dateB;
            });
            
            let test4Degerleri = [];
            let test7Degerleri = [];
            let farkDegerleri = [];
            
            for (let idx = 0; idx < kosularSorted.length; idx++) {
                const atKosu = kosularSorted[idx];
                const gecmisMesafe = atKosu.mesafe;
                const dereceStr = atKosu.at_derece;
                const birinciDerece = atKosu.birinci_derece;
                const dereceSalise = dereceToSalise(dereceStr);
                const birinciSalise = dereceToSalise(birinciDerece);
                const dr_sl = metreBasiSalise(dereceSalise, gecmisMesafe);
                const birinci_dr_sl = metreBasiSalise(birinciSalise, gecmisMesafe);
                
                let test1_salise = null;
                if (dr_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test1_salise = hedefMesafe * dr_sl;
                }
                
                let son800_2 = atKosu.son800_iki;
                if (!son800_2 || son800_2 === '-') son800_2 = atKosu.son800_bir;
                const son800_2Salise = dereceToSalise(son800_2);
                const son800_2_sl = son800_2Salise ? son800_2Salise / 800 : null;
                let test3_salise = null;
                if (son800_2_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test3_salise = hedefMesafe * son800_2_sl;
                }
                let test4_salise = null;
                if (test1_salise !== null && test3_salise !== null) {
                    test4_salise = test3_salise - test1_salise;
                }
                if (test4_salise !== null) {
                    test4Degerleri.push(test4_salise);
                }
                
                // TEST7 için
                let son800_1 = atKosu.son800_bir;
                const son800_1Salise = dereceToSalise(son800_1);
                const son800_1_sl = son800_1Salise ? son800_1Salise / 800 : null;
                let test2_salise = null;
                if (son800_1_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test2_salise = hedefMesafe * son800_1_sl;
                }
                let test7_salise = null;
                if (test1_salise !== null && test2_salise !== null) {
                    test7_salise = test1_salise - test2_salise;
                }
                if (test7_salise !== null) {
                    test7Degerleri.push(test7_salise);
                }
                
                // FARK değeri (1DR/SL - DR/SL)
                let farkDegeri = null;
                if (birinci_dr_sl !== null && dr_sl !== null) {
                    farkDegeri = birinci_dr_sl - dr_sl;
                }
                if (farkDegeri !== null) {
                    farkDegerleri.push(farkDegeri);
                }
            }
            
            if (test4Degerleri.length > 0) {
                const ilkTest4 = test4Degerleri[0];
                const sonTest4 = test4Degerleri[test4Degerleri.length - 1];
                horseTest4Farki[j] = sonTest4 - ilkTest4;
            } else {
                horseTest4Farki[j] = null;
            }
            
            if (test7Degerleri.length > 0) {
                const ilkTest7 = test7Degerleri[0];
                const sonTest7 = test7Degerleri[test7Degerleri.length - 1];
                horseTest7Farki[j] = sonTest7 - ilkTest7;
            } else {
                horseTest7Farki[j] = null;
            }
            
            if (farkDegerleri.length > 0) {
                horseIlkFark[j] = farkDegerleri[0];
                horseSonFark[j] = farkDegerleri[farkDegerleri.length - 1];
                horseFarklarinFarki[j] = horseSonFark[j] - horseIlkFark[j];
            } else {
                horseIlkFark[j] = null;
                horseSonFark[j] = null;
                horseFarklarinFarki[j] = null;
            }
        }
        
        // Satır verilerini topla
        let raceRowsData = [];
        
        for (let j = 0; j < race.horses.length; j++) {
            const horse = race.horses[j];
            const kosular = horse.kosular || [];
            const test8Deger = horseTest4Farki[j];
            const test9Deger = horseTest7Farki[j];
            const ilkFarkDeger = horseIlkFark[j];
            const sonFarkDeger = horseSonFark[j];
            const farklarinFarkiDeger = horseFarklarinFarki[j];
            
            // Koşuları tarihe göre sırala (gösterim için - en yeniden en eskiye)
            const kosularSorted = [...kosular].sort((a, b) => {
                const dateA = a.tarih ? new Date(a.tarih.split('.').reverse().join('-')) : new Date(0);
                const dateB = b.tarih ? new Date(b.tarih.split('.').reverse().join('-')) : new Date(0);
                return dateB - dateA;
            });
            
            for (let idx = 0; idx < kosularSorted.length; idx++) {
                const atKosu = kosularSorted[idx];
                const originalIdx = kosular.findIndex(k => k.tarih === atKosu.tarih && k.at_derece === atKosu.at_derece);
                
                const gecmisMesafe = atKosu.mesafe;
                const dereceStr = atKosu.at_derece;
                const birinciDerece = atKosu.birinci_derece;
                let son800_1 = atKosu.son800_bir;
                let son800_2 = atKosu.son800_iki;
                if (!son800_2 || son800_2 === '-') son800_2 = son800_1;
                
                const dereceSalise = dereceToSalise(dereceStr);
                const birinciSalise = dereceToSalise(birinciDerece);
                const son800_1Salise = dereceToSalise(son800_1);
                const son800_2Salise = dereceToSalise(son800_2);
                
                const dr_sl = metreBasiSalise(dereceSalise, gecmisMesafe);
                const birinci_dr_sl = metreBasiSalise(birinciSalise, gecmisMesafe);
                const son800_1_sl = son800_1Salise ? son800_1Salise / 800 : null;
                const son800_2_sl = son800_2Salise ? son800_2Salise / 800 : null;
                
                const fark = (birinci_dr_sl && dr_sl) ? (birinci_dr_sl - dr_sl) : null;
                const fark_8002_8001 = (son800_2_sl && son800_1_sl) ? (son800_2_sl - son800_1_sl) : null;
                
                let test1_salise = null, test2_salise = null, test3_salise = null;
                if (dr_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test1_salise = hedefMesafe * dr_sl;
                }
                if (son800_1_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test2_salise = hedefMesafe * son800_1_sl;
                }
                if (son800_2_sl !== null && !isNaN(hedefMesafe) && hedefMesafe > 0) {
                    test3_salise = hedefMesafe * son800_2_sl;
                }
                
                // Kırmızı renk kontrolü
                let kirmiziYazi = false;
                if (test1_salise !== null && test2_salise !== null && test3_salise !== null) {
                    if (test1_salise < test2_salise && test1_salise < test3_salise) {
                        kirmiziYazi = true;
                    }
                }
                
                let test4_salise = null, test5_salise = null, test6_salise = null, test7_salise = null;
                if (test1_salise && test3_salise) test4_salise = test3_salise - test1_salise;
                if (test1_salise !== null && birinciSalise !== null) {
                    test5_salise = test1_salise - birinciSalise;
                }
                if (test1_salise && test2_salise) test6_salise = test2_salise - test1_salise;
                if (test1_salise !== null && test2_salise !== null) {
                    test7_salise = test1_salise - test2_salise;
                }
                
                // TEST5 yeşil renk kontrolü
                let yesilYazi = false;
                if (test5_salise !== null) {
                    let test5Fark = test5_salise / 100;
                    if (test5Fark < 1) {
                        yesilYazi = true;
                    }
                }
                
                let ayniMi = (test4_salise !== null && test6_salise !== null && test4_salise === test6_salise);
                let test1Class = enIyilerTest1.has(`${j}_${originalIdx}`) ? 'eniyi-test1' : '';
                let test2Class = enIyilerTest2.has(`${j}_${originalIdx}`) ? 'eniyi-test2' : '';
                
                let gosterimFark = (birinci_dr_sl && dr_sl) ? (birinci_dr_sl - dr_sl) : null;
                
                // Satır verilerini oluştur
                let rowValues = [
                    (idx+1).toString(),
                    horse.name || '-',
                    horse.atId || '-',
                    atKosu.tarih || '-',
                    atKosu.sehir || '-',
                    gecmisMesafe || '-',
                    atKosu.sira || '-',
                    dereceStr || '-',
                    birinciDerece || '-',
                    son800_1 || '-',
                    son800_2 || '-',
                    dr_sl ? dr_sl.toFixed(4) : '-',
                    birinci_dr_sl ? birinci_dr_sl.toFixed(4) : '-',
                    gosterimFark ? (gosterimFark > 0 ? '+' : '') + gosterimFark.toFixed(4) : '-',
                    son800_1_sl ? son800_1_sl.toFixed(4) : '-',
                    son800_2_sl ? son800_2_sl.toFixed(4) : '-',
                    fark_8002_8001 ? (fark_8002_8001 > 0 ? '+' : '') + fark_8002_8001.toFixed(4) : '-',
                    test1_salise ? saliseToDerece(test1_salise) : '-',
                    test2_salise ? saliseToDerece(test2_salise) : '-',
                    test3_salise ? saliseToDerece(test3_salise) : '-',
                    test4_salise ? saliseToFarkFormat(test4_salise) : '-',
                    saliseToFarkFormat(test5_salise),
                    test6_salise ? saliseToFarkFormat(test6_salise) : '-',
                    test7_salise ? saliseToFarkFormat(test7_salise) : '-',
                    test8Deger !== null ? saliseToFarkFormat(test8Deger) : '-',
                    test9Deger !== null ? saliseToFarkFormat(test9Deger) : '-',
                    ilkFarkDeger !== null ? (ilkFarkDeger > 0 ? '+' : '') + ilkFarkDeger.toFixed(4) : '-',
                    sonFarkDeger !== null ? (sonFarkDeger > 0 ? '+' : '') + sonFarkDeger.toFixed(4) : '-',
                    farklarinFarkiDeger !== null ? (farklarinFarkiDeger > 0 ? '+' : '') + farklarinFarkiDeger.toFixed(4) : '-'
                ];
                
                raceRowsData.push({
                    element: null,
                    values: rowValues,
                    classes: {
                        satirClass: ayniMi ? 'sari-satir' : '',
                        test4Class: ayniMi ? 'sari-hucre' : '',
                        test6Class: ayniMi ? 'sari-hucre' : '',
                        test1Class: test1Class,
                        test2Class: test2Class,
                        kirmiziClass: kirmiziYazi ? 'kirmizi-yazi' : '',
                        yesilClass: yesilYazi ? 'yesil-yazi' : ''
                    }
                });
            }
        }
        
        // Sıralama uygula
        if (currentSort.column !== null && currentSort.direction) {
            let columnIndex = currentSort.column;
            let type = 'string';
            // Sütun tipini belirleme
            if (columnIndex === 0 || columnIndex === 3 || columnIndex === 6 || columnIndex >= 11) {
                type = 'number';
            } else if (columnIndex === 2) { // MESAFE
                type = 'number';
            } else if (columnIndex === 4) { // TARİH
                type = 'date';
            }
            raceRowsData = sortTableData(raceRowsData, columnIndex, type, currentSort.direction);
        }
        
        // Tablo HTML'ini oluştur
        let raceHtml = `<div class="race-card">`;
        raceHtml += `<div class="race-header">🏆 ${race.raceNo}. KOŞU (${race.horses.length} at) - MESAFE: ${mesafeGosterim}</div>`;
        raceHtml += `<div style="overflow-x:auto;">`;
        raceHtml += `<table border="0" id="raceTable_${i}">`;
        raceHtml += `<thead><tr>`;
        raceHtml += `<th data-column="0" data-type="number">SIRA <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="1" data-type="string">AT İSMİ <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="2" data-type="string">AT ID <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="3" data-type="date">TARİH <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="4" data-type="string">ŞEHİR <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="5" data-type="number">MESAFE <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="6" data-type="number">SIRA <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="7" data-type="string">AT DERECE <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="8" data-type="string">1.DERECE <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="9" data-type="string">SON800-1 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="10" data-type="string">SON800-2 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="11" data-type="number">DR/SL <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="12" data-type="number">1DR/SL <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="13" data-type="number">FARK <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="14" data-type="number">8001/SL <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="15" data-type="number">8002/SL <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="16" data-type="number">8002-8001 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="17" data-type="string">TEST1 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="18" data-type="string">TEST2 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="19" data-type="string">TEST3 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="20" data-type="number">TEST4 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="21" data-type="number">TEST5 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="22" data-type="number">TEST6 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="23" data-type="number">TEST7 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="24" data-type="number">TEST8 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="25" data-type="number">TEST9 <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="26" data-type="number">İLK FARK <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="27" data-type="number">SON FARK <span class="sort-icon">↕️</span></th>`;
        raceHtml += `<th data-column="28" data-type="number">FARKLARIN FARKI <span class="sort-icon">↕️</span></th>`;
        raceHtml += `</thead><tbody>`;
        
        for (let r = 0; r < raceRowsData.length; r++) {
            const row = raceRowsData[r];
            const vals = row.values;
            const cls = row.classes;
            
            raceHtml += `<tr class="${cls.satirClass}">`;
            for (let c = 0; c < vals.length; c++) {
                let cellClass = '';
                if (c === 16) cellClass = cls.test1Class;
                else if (c === 17) cellClass = cls.test2Class;
                else if (c === 19 && cls.test4Class) cellClass = cls.test4Class;
                else if (c === 21 && cls.test6Class) cellClass = cls.test6Class;
                else if (c === 16 || c === 17 || c === 18) cellClass = cls.kirmiziClass;
                else if (c === 20) cellClass = cls.yesilClass;
                
                raceHtml += `<td class="${cellClass}">${vals[c]}</td>`;
            }
            raceHtml += `</tr>`;
        }
        
        raceHtml += `</tbody></table></div></div><br>`;
        html += raceHtml;
    }
    
    document.getElementById('gosterimResults').innerHTML = html;
    
    // Sıralama olaylarını bağla
    document.querySelectorAll('.race-card table').forEach(table => {
        const headers = table.querySelectorAll('th');
        headers.forEach((th, idx) => {
            th.style.cursor = 'pointer';
            th.addEventListener('click', (e) => {
                e.stopPropagation();
                const column = th.getAttribute('data-column');
                const type = th.getAttribute('data-type');
                if (!column) return;
                
                // Mevcut sıralama yönünü belirle
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'asc';
                }
                
                // Tüm th'lerden sıralama sınıflarını kaldır
                headers.forEach(h => {
                    h.classList.remove('sort-asc', 'sort-desc');
                });
                th.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                
                // Tabloyu yeniden oluştur
                displayResults(currentHesaplamaData);
            });
        });
    });
}

function escapeHtml(s) {
    if (!s) return '-';
    return String(s).replace(/[&<>]/g, function(m) {
        return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
    });
}
</script>
