<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>88ATSPEED | Hesaplama Kaydı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .header {
            text-align: center;
            background: linear-gradient(135deg, rgba(255,152,0,0.1), rgba(76,175,80,0.1));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,152,0,0.3);
        }
        .logo { font-size: 32px; font-weight: 800; }
        .logo-88 { color: #ff9800; }
        .logo-at { color: #4CAF50; }
        .logo-speed { color: #2196F3; }
        .meta { color: rgba(255,255,255,0.7); margin-top: 8px; font-size: 14px; }
        .status { padding: 12px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .status-loading { background: rgba(255,152,0,0.2); color: #ff9800; }
        .status-success { background: rgba(76,175,80,0.2); color: #4CAF50; }
        .status-error { background: rgba(244,67,54,0.2); color: #f44336; }
        .race-card {
            background: rgba(30, 30, 60, 0.6);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .race-header {
            background: linear-gradient(135deg, rgba(255,152,0,0.2), rgba(76,175,80,0.1));
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .race-header h3 { font-size: 17px; font-weight: 700; }
        .table-wrapper { padding: 15px; overflow-x: auto; }
        table { border-collapse: collapse; font-size: 11px; width: 100%; min-width: 2800px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(0,0,0,0.4); color: #ff9800; font-weight: 600; position: sticky; top: 0; }
        .horse-no { font-weight: 800; color: #ff9800; text-align: center; background: rgba(0,0,0,0.3); }
        .son800-badge {
            background: linear-gradient(135deg, #ff9800, #f44336);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 700;
            display: inline-block;
        }
        .sticky-col { position: sticky; left: 0; background: #1a1a3e; z-index: 1; }
        .sticky-col2 { position: sticky; left: 50px; background: #1a1a3e; z-index: 1; }
        .sticky-col3 { position: sticky; left: 180px; background: #1a1a3e; z-index: 1; }
        .toolbar { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer;
            font-weight: 600; color: white; background: linear-gradient(135deg, #2196F3, #1976D2);
        }
        .btn-gosterim { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="logo-88">88</span><span class="logo-at">AT</span><span class="logo-speed">SPEED</span>
        </div>
        <div class="meta" id="kayitMeta">Hesaplama kaydı yükleniyor...</div>
    </div>
    <div id="status"></div>
    <div class="toolbar" id="toolbar" style="display:none;">
        <button class="btn btn-gosterim" id="gosterimBtn">👁️ GÖSTERİM SEKMESİNDE AÇ</button>
        <button class="btn" onclick="window.print()">🖨️ YAZDIR</button>
    </div>
    <div id="content"></div>

    <script src="/js/utils.js"></script>
    <script>
        let kayitId = new URLSearchParams(window.location.search).get('id');

        function renderHesaplama(races, meta) {
            if (!races || !races.length) {
                document.getElementById('content').innerHTML = '<div class="status status-error">Veri bulunamadı</div>';
                return;
            }
            let html = '';
            for (const race of races) {
                let thead = '<thead><tr>';
                thead += '<th class="sticky-col">#</th><th class="sticky-col2">AT İSMİ</th><th class="sticky-col3">AT ID</th>';
                for (let k = 1; k <= 7; k++) thead += '<th colspan="8" style="text-align:center;background:#ff9800;color:#000;">KOŞU ' + k + '</th>';
                thead += '</tr><tr><th class="sticky-col">#</th><th class="sticky-col2">AT İSMİ</th><th class="sticky-col3">AT ID</th>';
                for (let k = 1; k <= 7; k++) {
                    thead += '<th>TARİH</th><th>ŞEHİR</th><th>MESAFE</th><th>SIRA</th><th>AT DEREÇE</th><th>BİR.DEREÇE</th><th>SON800-1</th><th>SON800-2</th>';
                }
                thead += '</tr></thead>';

                let tbody = '<tbody>';
                for (const horse of race.horses) {
                    const kosular = horse.kosular || [];
                    tbody += '<tr>';
                    tbody += '<td class="horse-no sticky-col">' + AtSpeedUtils.escapeHtml(horse.no) + '</td>';
                    tbody += '<td class="sticky-col2"><strong>' + AtSpeedUtils.escapeHtml(horse.name) + '</strong></td>';
                    tbody += '<td class="sticky-col3">' + AtSpeedUtils.escapeHtml(horse.atId || '-') + '</td>';
                    for (let k = 0; k < 7; k++) {
                        const kose = kosular[k] || {};
                        tbody += '<td>' + AtSpeedUtils.escapeHtml(kose.tarih || '-') + '</td>';
                        tbody += '<td>' + AtSpeedUtils.escapeHtml(kose.sehir || '-') + '</td>';
                        tbody += '<td>' + AtSpeedUtils.escapeHtml(kose.mesafe || '-') + '</td>';
                        tbody += '<td>' + AtSpeedUtils.escapeHtml(kose.sira || '-') + '</td>';
                        tbody += '<td>' + AtSpeedUtils.escapeHtml(kose.at_derece || '-') + '</td>';
                        tbody += '<td>' + AtSpeedUtils.escapeHtml(kose.birinci_derece || '-') + '</td>';
                        tbody += '<td><span class="son800-badge">' + AtSpeedUtils.escapeHtml(kose.son800_bir || '-') + '</span></td>';
                        tbody += '<td><span class="son800-badge">' + AtSpeedUtils.escapeHtml(kose.son800_iki || '-') + '</span></td>';
                    }
                    tbody += '</tr>';
                }
                tbody += '</tbody>';

                const mesafe = (race.mesafe && race.mesafe !== '?') ? race.mesafe + ' ' + (race.pist || '') : '?';
                html += '<div class="race-card"><div class="race-header"><h3>🏁 ' + race.raceNo + '. KOŞU (' + race.horses.length + ' at) - MESAFE: ' + mesafe + '</h3></div>';
                html += '<div class="table-wrapper"><table>' + thead + tbody + '</table></div></div>';
            }
            document.getElementById('content').innerHTML = html;
            if (meta) {
                document.getElementById('kayitMeta').textContent =
                    '📅 ' + meta.tarih + ' | 🏟️ ' + meta.hipodrom + ' | 🐎 ' + meta.total_horses + ' at | 💾 Kayıt #' + meta.id;
            }
            document.getElementById('toolbar').style.display = 'flex';
        }

        async function loadKayit(id) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '<div class="status status-loading">⏳ Kayıt yükleniyor...</div>';
            try {
                const resp = await fetch('/api/hesaplama-kayit/' + id);
                const result = await resp.json();
                if (!result.success) throw new Error(result.error);
                renderHesaplama(result.kayit.veri, {
                    id: result.kayit.id,
                    tarih: result.kayit.tarih,
                    hipodrom: result.kayit.hipodrom,
                    total_horses: result.kayit.total_horses
                });
                statusEl.innerHTML = '<div class="status status-success">✅ Kayıt yüklendi</div>';
                document.getElementById('gosterimBtn').onclick = () => {
                    window.open('/gosterim_full.html?kayit=' + id, '_blank');
                };
            } catch (e) {
                statusEl.innerHTML = '<div class="status status-error">❌ ' + e.message + '</div>';
            }
        }

        if (kayitId) {
            loadKayit(kayitId);
        } else {
            document.getElementById('status').innerHTML = '<div class="status status-error">❌ Kayıt ID bulunamadı</div>';
        }
    </script>
</body>
</html>
