<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Yönetici Girişi | 88 AT SPEED</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="css/landing.css?v=20260903site" rel="stylesheet">
</head>
<body class="lp-body">
    <div class="lp-bg-glow"></div>
    <div class="lp-login-wrap">
        <div class="lp-login-card">
            <div class="lp-logo" style="justify-content:center;margin-bottom:20px">
                <span class="n88">88</span><span class="nat">AT</span><span class="nsp">SPEED</span>
            </div>
            <h1>Yönetim Paneli</h1>
            <p class="lp-sub">Analiz araçlarına erişmek için yönetici şifrenizi girin.</p>
            <div id="loginError" class="lp-error"></div>
            <form id="loginForm">
                <div class="lp-field">
                    <label for="password">Yönetici şifresi</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
                </div>
                <button type="submit" class="lp-btn lp-btn-primary" id="loginBtn">Giriş Yap</button>
            </form>
            <a href="/" class="lp-back">← Ana sayfaya dön</a>
        </div>
    </div>
    <script>
        (async function() {
            try {
                const r = await fetch('/api/admin/session');
                const j = await r.json();
                if (j.authenticated) window.location.href = '/panel.html';
            } catch (_) {}

            const form = document.getElementById('loginForm');
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                errEl.style.display = 'none';
                btn.disabled = true;
                btn.textContent = 'Giriş yapılıyor…';
                try {
                    const res = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: document.getElementById('password').value })
                    });
                    const json = await res.json();
                    if (!res.ok || !json.success) {
                        throw new Error(json.error || 'Giriş başarısız');
                    }
                    window.location.href = '/panel.html';
                } catch (err) {
                    errEl.textContent = err.message || 'Giriş başarısız';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Giriş Yap';
                }
            });
        })();
    </script>
</body>
</html>
